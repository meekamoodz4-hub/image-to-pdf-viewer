name: Build Image to PDF Viewer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore upload signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, re
          value = os.environ["ANDROID_KEYSTORE_BASE64"].strip()
          marker = value.find("/u3+")
          if marker >= 0:
              value = value[marker:]
          value = re.sub(r"[^A-Za-z0-9+/=]", "", value)
          try:
              decoded = base64.b64decode(value, validate=True)
          except Exception as exc:
              raise SystemExit("Signing secret is incomplete or contains invalid Base64 characters.") from exc
          with open("app/upload-key.jks", "wb") as key_file:
              key_file.write(decoded)
          PY
          test -s app/upload-key.jks
          keytool -list -keystore app/upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Image-to-PDF-Viewer-SIGNED-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Image-to-PDF-Viewer-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Remove signing key from workspace
        if: always()
        run: rm -f app/upload-key.jks
